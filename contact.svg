<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 240" width="1000" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040916"/><stop offset=".55" stop-color="#0a1a45"/><stop offset="1" stop-color="#050b1f"/></linearGradient>
<linearGradient id="gb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f7bff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
<linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3b30"/><stop offset="1" stop-color="#ff8a00"/></linearGradient>
<linearGradient id="bord" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7bff"><animate attributeName="stop-color" values="#2f7bff;#ff3b30;#00e5ff;#2f7bff" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#ff3b30"><animate attributeName="stop-color" values="#ff3b30;#00e5ff;#2f7bff;#ff3b30" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#2f7bff" stop-opacity=".55"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0"/></radialGradient>
<radialGradient id="glowR"><stop offset="0" stop-color="#ff3b30" stop-opacity=".45"/><stop offset="1" stop-color="#ff3b30" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2f7bff" stroke-opacity=".10"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.m{font-family:JetBrains Mono, Consolas, Courier New, monospace} .d{font-family:Arial Black, Impact, Helvetica, Arial, sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sweep{0%{transform:translateY(-10px)}100%{transform:translateY(250px)}}
.blink{animation:blink 1s steps(1) infinite} .pulse{animation:pulse 2.4s ease-in-out infinite}
.scan{animation:sweep 6s linear infinite}
</style>
<rect width="1000" height="240" fill="url(#bg)"/><rect width="1000" height="240" fill="url(#grid)"/>
<circle cx="500" cy="120" r="300" fill="url(#glowB)" class="pulse"/><rect class="scan" width="1000" height="2" fill="#2f7bff" opacity=".25"/><text class="m" x="500" y="48" font-size="11" letter-spacing="3" fill="#6f8fd6" text-anchor="middle">06 / START A CONVERSATION</text><text class="d" x="500" y="118" font-size="52" fill="#fff" text-anchor="middle" textLength="760" lengthAdjust="spacingAndGlyphs" filter="url(#glow)">LET'S BUILD SOMETHING GREAT.</text><text class="m" x="500" y="162" font-size="15" fill="#9fb3d9" text-anchor="middle">Ideas. Opportunities. Your next move.</text><g transform="translate(880 150) skewX(-20) scale(1)" class="pulse"><rect x="0" width="7" height="22" fill="#ff3b30"/><rect x="12" width="7" height="22" fill="#ff3b30"/><rect x="24" width="7" height="22" fill="#ff3b30"/></g><rect x="120" y="190" width="760" height="3" fill="url(#gb)"><animate attributeName="width" values="0;760;0" dur="5s" repeatCount="indefinite"/></rect></svg>